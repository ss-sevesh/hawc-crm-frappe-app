version: "3"
services:
  mariadb:
    image: mariadb:10.6
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mariadb-data:/var/lib/mysql

  redis-cache:
    image: redis:6.2-alpine
  
  redis-queue:
    image: redis:6.2-alpine

  frappe:
    image: frappe/bench:latest
    user: frappe
    ports:
      - "8000:8000"
    volumes:
      - .:/home/frappe/hawc_crm_src
      - bench-data:/home/frappe/mybench
    command: >
      bash -c "
      echo 'Starting Frappe Setup...';
      cd /home/frappe;
      if [ ! -d 'mybench' ]; then
        bench init --skip-redis-config-generation --frappe-branch version-15 mybench;
      fi;
      cd mybench;
      bench set-config -g db_host mariadb;
      bench set-config -g redis_cache redis://redis-cache:6379;
      bench set-config -g redis_queue redis://redis-queue:6379;
      bench set-config -g redis_socketio redis://redis-queue:6379;
      if [ ! -d 'apps/hawc_crm' ]; then
        cp -r /home/frappe/hawc_crm_src apps/hawc_crm;
        bench get-app hawc_crm apps/hawc_crm;
      fi;
      if [ ! -f 'sites/hawc.localhost/site_config.json' ]; then
        echo 'Waiting for MariaDB to be ready...';
        sleep 10;
        bench new-site hawc.localhost --admin-password admin --mariadb-root-password root --install-app hawc_crm;
        bench use hawc.localhost;
      fi;
      echo 'Setup Complete! Starting Server on port 8000...';
      bench start
      "
    depends_on:
      - mariadb
      - redis-cache
      - redis-queue

volumes:
  mariadb-data:
  bench-data:
